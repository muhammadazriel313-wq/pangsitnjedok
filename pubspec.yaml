name: aplikasipangsitnjedok
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: '>=3.10.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  device_preview: ^1.3.1
  http: ^1.1.0  # Tambahkan ini, pastikan sejajar dengan tulisan 'flutter:' di atas
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # Mendaftarkan folder assets
  assets:
    - assets/images/

  # (Komentar bawaan lainnya saya hapus sebagian agar filemu lebih bersih dan mudah dibaca)
  # Bagian assets harus masuk 2 spasi dari kata 'flutter'
  # Tanda strip (-) harus masuk 2 spasi lagi dari kata 'assets'