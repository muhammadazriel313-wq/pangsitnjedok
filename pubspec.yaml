name: aplikasipangsitnjedok
description: "A new Flutter project for Pangsit Njedok Management System."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Icon standar iOS
  cupertino_icons: ^1.0.6
  
  google_fonts: ^8.1.0
  
  # Untuk pop-up pesan sukses/error yang cantik
  awesome_dialog: ^3.1.0
  
  # Untuk menghubungkan Flutter ke PHP/MySQL
  http: ^1.6.0
  
  # Untuk mengambil foto menu dari galeri/kamera
  image_picker: ^1.2.2
  
  # PENTING: Untuk fitur Kalender (DatePicker) dan Format Rupiah di profit Admin
  intl: ^0.18.1

  # Penyimpanan lokal sederhana untuk data cart
  shared_preferences: ^2.2.3

  # Notifikasi lokal saat status order selesai
  # flutter_local_notifications: ^17.2.3

  # Firebase Cloud Messaging (push notification)
  # Nonaktifkan dulu - butuh google-services.json & flutterfire configure
  # firebase_core: ^3.15.1
  # firebase_messaging: ^15.2.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Pastikan folder assets sudah terdaftar agar gambar muncul
  assets:
    - assets/images/
    # Jika kamu punya gambar spesifik untuk logo, daftarkan di bawah ini:
    # - assets/images/logo.png

  # Jika kamu menggunakan font khusus seperti 'Inter' yang ada di kode Dashboard:
  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
